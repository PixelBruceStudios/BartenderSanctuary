<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0f0d"/>
      <stop offset="100%" stop-color="#121916"/>
    </linearGradient>
    <linearGradient id="flask" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fbc8f" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#c8a84c" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <!-- Grid -->
  <g stroke="#30403a" stroke-width="1" opacity="0.4">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="500" x2="1200" y2="500"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
    <line x1="800" y1="0" x2="800" y2="600"/>
    <line x1="1000" y1="0" x2="1000" y2="600"/>
  </g>
  <!-- Central flask -->
  <g transform="translate(600,320)" filter="url(#glow)">
    <path d="M-60,-80 L-60,-20 Q-60,40 0,90 Q60,40 60,-20 L60,-80 Z" fill="none" stroke="url(#flask)" stroke-width="4"/>
    <path d="M-40,-80 L-40,-30 Q-40,20 0,60 Q40,20 40,-30 L40,-80 Z" fill="#8fbc8f" fill-opacity="0.15" stroke="none"/>
    <circle cx="0" cy="-110" r="16" fill="none" stroke="#c8a84c" stroke-width="4"/>
    <line x1="0" y1="-94" x2="0" y2="-80" stroke="#c8a84c" stroke-width="4"/>
    <!-- Bubbles -->
    <circle cx="-15" cy="20" r="6" fill="#c8a84c" fill-opacity="0.7"/>
    <circle cx="10" cy="35" r="4" fill="#5ba4a0" fill-opacity="0.8"/>
    <circle cx="-5" cy="50" r="5" fill="#c8a84c" fill-opacity="0.6"/>
  </g>
  <!-- Floating molecules -->
  <g opacity="0.9">
    <g transform="translate(180,140)">
      <circle cx="0" cy="0" r="12" fill="#5ba4a0" opacity="0.8"/>
      <circle cx="35" cy="15" r="10" fill="#c8a84c" opacity="0.8"/>
      <line x1="10" y1="5" x2="26" y2="12" stroke="#a4b5ad" stroke-width="2"/>
    </g>
    <g transform="translate(980,180)">
      <circle cx="0" cy="0" r="14" fill="#c8a84c" opacity="0.8"/>
      <circle cx="40" cy="-10" r="11" fill="#8fbc8f" opacity="0.8"/>
      <line x1="12" y1="-4" x2="30" y2="-8" stroke="#a4b5ad" stroke-width="2"/>
    </g>
    <g transform="translate(220,420)">
      <circle cx="0" cy="0" r="10" fill="#c8a84c" opacity="0.7"/>
      <circle cx="30" cy="20" r="13" fill="#5ba4a0" opacity="0.7"/>
      <line x1="10" y1="8" x2="22" y2="15" stroke="#a4b5ad" stroke-width="2"/>
    </g>
    <g transform="translate(940,440)">
      <circle cx="0" cy="0" r="13" fill="#8fbc8f" opacity="0.7"/>
      <circle cx="-35" cy="15" r="10" fill="#c8a84c" opacity="0.7"/>
      <line x1="-12" y1="6" x2="-24" y2="12" stroke="#a4b5ad" stroke-width="2"/>
    </g>
  </g>
  <!-- Title treatment -->
  <text x="600" y="80" text-anchor="middle" fill="#e6ece9" font-family="Georgia, serif" font-size="38" font-weight="600" letter-spacing="-0.02em">The Modernist Cocktail Revolution</text>
  <text x="600" y="115" text-anchor="middle" fill="#a4b5ad" font-family="Inter, sans-serif" font-size="16" letter-spacing="0.15em" text-transform="uppercase">SCIENCE + SPIRITS</text>
</svg>
